<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Filter Funds Quote Card (Light)</title>
<link rel="stylesheet" href="quote-card-light.css" />
</head>
<body>
  <div class="stage" id="stage">
    <div class="bg-zoom"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="mark">FILTER&nbsp;FUNDS</div>
      <div class="divider" id="divider"></div>
      <p class="quote" id="quote">Loading...</p>
    </div>

    <div class="footer">
      <span class="handle" id="handle">@filterfunds</span>
      <span class="dot">&bull;</span>
      <span class="website" id="website">filterfunds.com</span>
    </div>
  </div>

  <script src="quote-card.js"></script>
</body>
</html>
