name: Daily Filter Funds Post

on:
  schedule:
    # 03:30 UTC == 9:00 AM IST (Asia/Kolkata). GitHub Actions cron is
    # best-effort and can slip by several minutes, especially on the hour.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-filter-funds-post
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run daily content pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/run-daily.js

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-funds-post-${{ github.run_id }}
          path: |
            output/current-content.json
            output/video.mp4
            output/cover.jpg
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated content history
        if: always()
        run: |
          git config user.name "filter-funds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record post generated on $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to content/history.json to commit."
          fi
